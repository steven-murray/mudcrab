[package]
name = "mudcrab"
version = "0.1.0"
edition = "2024"
# 1.88 is where let-chains stabilised, which this crate uses in ten places.
# Not yet verified by CI against that toolchain.
rust-version = "1.88"
description = "A declarative modlist compiler and installer for TES4: Oblivion, including a headless replacement for zEdit's zMerge"
license = "MIT OR Apache-2.0"
# repository = "..."   # set this before publishing to crates.io
readme = "readme.md"
keywords = ["oblivion", "modding", "modlist", "bethesda", "mod-organizer"]
categories = ["command-line-utilities", "game-development"]
exclude = ["MOFAM-test/", "docs/design/bsa-header-flags.csv"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
globset = "0.4"
indexmap = { version = "2.7", features = ["serde"] }
md5 = "0.8.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = "2.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.20"
wiremock = "0.6"
