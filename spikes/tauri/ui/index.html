<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mudcrab spike (Tauri)</title>
<style>
  :root {
    --bg: #15171c; --panel: #1d2027; --row: #20242c; --row-alt: #1b1e25;
    --line: #2d323c; --text: #e6e8ec; --dim: #8a919e; --accent: #e8743b;
    --good: #5fbf7a; --bad: #e0605a; --drop: #e8743b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Cantarell, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .path { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tabs button { background: none; border: 1px solid transparent; color: var(--dim); padding: 6px 12px;
    border-radius: 6px; font: inherit; cursor: pointer; }
  .tabs button.on { color: var(--text); border-color: var(--line); background: var(--row); }
  main { overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.on { display: flex; }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--dim); }
  .toolbar input { background: var(--row); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font: inherit; width: 420px; }
  .scroll { overflow: auto; flex: 1; position: relative; }
  .row { display: grid; align-items: center; height: 30px; padding: 0 16px; border-bottom: 1px solid var(--row-alt);
    background: var(--row); user-select: none; white-space: nowrap; }
  .row:nth-child(even) { background: var(--row-alt); }
  .lo .row { grid-template-columns: 22px 44px 1fr 1fr 70px; cursor: grab; }
  .lo .row .n { color: var(--dim); text-align: right; padding-right: 12px; font-variant-numeric: tabular-nums; }
  .lo .row .grip { color: var(--dim); }
  .lo .row .mods { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; justify-self: end; }
  .row.dragging { position: absolute; left: 0; right: 0; z-index: 2; opacity: .95; cursor: grabbing;
    box-shadow: 0 6px 18px rgba(0,0,0,.5); background: #2a2f3a; }
  .row.gap { background: transparent !important; border: 1px dashed var(--drop); }
  .tree .row { grid-template-columns: 1fr minmax(0, 45%); gap: 12px; }
  .tree .name { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .tree .twisty { width: 14px; color: var(--dim); cursor: pointer; text-align: center; flex: none; }
  .tree input[type=checkbox] { appearance: none; -webkit-appearance: none; margin: 0; flex: none;
    width: 15px; height: 15px; border: 1px solid var(--dim); border-radius: 3px; background: transparent;
    display: grid; place-content: center; cursor: pointer; }
  .tree input[type=checkbox]:checked, .tree input[type=checkbox]:indeterminate {
    background: var(--accent); border-color: var(--accent); }
  .tree input[type=checkbox]:checked::after { content: "✓"; color: #fff; font-size: 11px; font-weight: 700; }
  .tree input[type=checkbox]:indeterminate::after { content: "–"; color: #fff; font-size: 11px; font-weight: 700; }
  .tree .label { overflow: hidden; text-overflow: ellipsis; }
  .tree .folder .label { font-weight: 600; }
  .tree .count, .tree .dest { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .tree .off .label { color: var(--dim); text-decoration: line-through; text-decoration-color: #555; }
  footer { border-top: 1px solid var(--line); background: var(--panel); max-height: 34vh; overflow: auto; }
  footer .status { padding: 6px 16px; color: var(--dim); font-size: 12px; }
  footer .status.bad { color: var(--bad); }
  footer .cmd { margin: 0 16px 6px; padding: 6px 10px; background: #0f1115; border-radius: 6px;
    font: 12px ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", monospace; color: var(--text); }
  footer .cmd::before { content: "$ "; color: var(--dim); }
  footer pre.diff { margin: 0 16px 10px; font: 12px ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", monospace; white-space: pre-wrap; }
  .add { color: var(--good); } .del { color: var(--bad); } .hunk { color: #6aa7d8; }
</style>
</head>
<body>
<header>
  <h1>mudcrab <span style="color:var(--accent)">spike</span> · Tauri</h1>
  <span class="path" id="path"></span>
  <nav class="tabs">
    <button data-view="lo" class="on">Load order</button>
    <button data-view="files">A mod's files</button>
  </nav>
</header>
<main>
  <section class="view lo on" id="lo">
    <div class="toolbar"><span id="lo-count"></span><span>Drag a plugin to move it.</span></div>
    <div class="scroll" id="lo-list"></div>
  </section>
  <section class="view files" id="files">
    <div class="toolbar">
      <label>Mod <input id="mod" list="mod-ids" placeholder="type a mod id"></label>
      <datalist id="mod-ids"></datalist>
      <span id="tree-label"></span>
    </div>
    <div class="scroll tree" id="tree"></div>
  </section>
</main>
<footer>
  <div class="status" id="status">Ready.</div>
  <div id="edit"></div>
</footer>
<script src="app.js"></script>
</body>
</html>
