[package]
name = "spike-tauri"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spike-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# custom-protocol: serve ui/ from the binary, as a release would, with no dev
# server (the spike has no JavaScript build step).
tauri = { version = "2", features = ["custom-protocol"] }
