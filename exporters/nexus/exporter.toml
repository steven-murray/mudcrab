# The guide as BBCode, to paste into a Nexus mod page or article (the editor's
# source mode). Nexus pages cannot hold files, so images are linked by `url`.
name = "nexus"
description = "BBCode for a Nexus mod page or article"
output = "file"
markup = "bbcode"
images = "url"

[[pages]]
template = "guide.j2"

[options.contents]
default = true
help = "List the top-level sections before the first one"

[options.choices]
default = true
help = "List the questions the list asks (its inputs), with their defaults"

[options.key]
default = true
help = "Explain the symbols the guide uses, before the contents"

[options.files]
default = true
help = "Link each mod's Nexus page and the file(s) to download"

[options.steps]
default = true
help = "Write out installer choices and the changes to make after installing"

[options.load_order]
default = true
help = "Close with the load order, in a spoiler"
