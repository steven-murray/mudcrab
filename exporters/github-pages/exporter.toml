# The guide as a Jekyll site for GitHub Pages: a landing page, the key, the
# setup, a page per top-level section, the closing text and the load order.
# Write it into a repository's `docs/` folder (or its root) and turn on Pages. Local images are copied into `images/`.
name = "github-pages"
description = "A Jekyll site for GitHub Pages: an index, a page per section, the load order"
base = "markdown"
output = "site"
images = "copy"

[[pages]]
template = "_config.yml.j2"
output = "_config.yml"

[[pages]]
template = "index.md.j2"
output = "index.md"

[[pages]]
template = "key.md.j2"
output = "key.md"

[[pages]]
template = "setup-page.md.j2"
output = "setup.md"

[[pages]]
template = "section-page.md.j2"
output = "{{ section.anchor }}.md"
for_each = "section"

[[pages]]
template = "closing.md.j2"
output = "closing.md"

[[pages]]
template = "load-order.md.j2"
output = "load-order.md"

# imgur, where many guides keep their pictures, refuses images asked for by
# some pages (a local preview, for one) but serves any request with no referrer.
[options.image_no_referrer]
default = true
help = "Ask browsers not to send a referrer for images; some image hosts refuse some referrers"

[options.theme]
default = "just-the-docs"
help = "Jekyll theme: just-the-docs (a sidebar of every page, and search), or minima or a jekyll-theme-* theme (pages linked from the index only)"
