# MOFAM merges, for building and verifying against the real install.
#
# Generated from zEdit's merges.json. This is deliberately NOT a full modlist:
# the source mods are declared as bare ids so the merges can name them, with no
# archives, because `mudcrab merge` only ever reads their folders.
#
#   mudcrab merge MOFAM-test/input/mofam.merges.toml \
#     --mods-dir ~/Games/Wabbajack/Oblivion/MOFAM-03.25/mods \
#     --output /tmp/mudcrab-merges --only "Unique Forts Merged"
#
# hide_sources is false throughout: this file builds plugins for inspection and
# must not rename anything in a real instance. The install path sets it true.
#
# NOTE: ORC.esp resolves to the v194 folder here, which is the upgraded mod.
# The *installed* Prebash Merge was built from v180 and never rebuilt, so this
# file will not reproduce it byte for byte -- that is intended, and the oracle
# test pins v180 separately. See MOFAM-test/notes/zmerge-dangling-refs.md.

