# From mod page 52949, which is MOFAM's own, so a post-guide date here is the
# guide updating itself rather than version drift.

# Guide 36 row 4. Eleven plugins in, one out: ten Better Forts from Part 26a
# and the consistency patch above.
#
# The output filename is a contract, not a preference -- the Bash Tags in the
# Conflict Resolution mod name it exactly, and the bashed patch degrades in
# silence if it does not match.
[[mods]]
id = "Unique Forts Merged"
section = ["36 - zMERGED PLUGINS"]
