# When this guide was published, and how to tell an archive newer than it.
#
# Facts about MOFAM, not about mudcrab, so they live here. `diff` reports an
# archive as POST-GUIDE when it postdates `published` -- meaning "the top file
# on the page" today is not the file the guide meant.
#
# The guide dates itself only as "03.25", so `published` is a judgement. It sits
# at 2025-03-18 rather than the start of the month because Part 21 row 1 settles
# it: the guide names CLUTTER_BETA1 by name and that file was published
# 2025-03-17, so any earlier date reports a file the guide explicitly asks for as
# newer than the guide.
#
# `file_id` dates archives whose filenames carry no Unix timestamp. Nexus
# allocates file ids in ascending order, so an id doubles as an upload date, and
# it beats MO2's `nexusLastModified`, which is frequently the day the file was
# *downloaded* rather than published. Derived from this list's own archives: of
# the 406 carrying both a file id and a filename timestamp, 405 order identically
# by either measure, and the boundary is clean -- largest pre-guide id
# 1000041155 (CLUTTER_BETA1, 2025-03-17), smallest post-guide 1000041165
# (T4UT Skies Repolished, 2025-03-18), nothing between. The 406th is Part 20
# row 8, whose two versions' MO2 sidecars claim the same file id.
#
# Both numbers move together: change `published` and the boundary must be
# re-derived, or it will be answering the old question.
guide = { published = "2025-03-18", file_id = 1000041165 }


