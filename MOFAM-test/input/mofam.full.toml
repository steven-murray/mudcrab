# mod assembled from two archives, so it is written as one -- and the
# "disable the other mod" step disappears with it.
#
# mudcrab reads and writes BSAs natively, so no BAE and no BSArch under WINE.
#
# The Oracle keeps an empty `OOO Voice FIles` folder from having done it the
# guide's way; `diff` reports that folder as missing from ours, correctly.
