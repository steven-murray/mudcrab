# ── Part 25 - ARTHMOOR'S TOWNS ──────────────────────────────────────────────
#
# One archetype, eight times. Each village ships as a base archive (a) plus a
# separately-hosted voice-acting archive (b); the guide says to drag both into
# BSArch Pro, pack one BSA named after the village, delete the loose folders,
# and disable mod b.
#
# Modelled as **one mod with two archives**, not two mods. mudcrab installs a
# mod's archives in order into the same folder, later overwriting earlier, which
# is exactly the overlay BSArch Pro's "Replace All" performs -- so the VA files
# win where they collide, and the b mod never has to exist as an installed-but-
# disabled entry. The Oracle keeps eight empty, disabled `*_VA` folders; those
# show as extras in `diff` and hold nothing.
#
# `pack_bsa` needs no `include` here: a BSA cannot store a file outside a
# folder, so the `.esp` and `.txt` at the mod root stay loose on their own and
# everything below `meshes/`, `sound/`, `textures/` and `video/` goes in. That
# is the Oracle's shape in all eight cases, verified by comparing every path and
# the exact payload byte count of all eight BSAs.
#
# All sixteen archives are manual: afkmods for the base mods, MediaFire and Mega
# for the VA files. None is on Nexus, so none has a file id.

