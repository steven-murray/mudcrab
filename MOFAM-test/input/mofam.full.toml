[inputs]

# ------------------------------
# Part 1 - CLEANED MASTERS
# ------------------------------

# Copies Oblivion's DLC .esp files from the game Data folder into a managed
# MO2 mod, then runs xEdit Quick Auto Clean on each one. The cleaned copies
# shadow the originals via MO2's VFS; the originals in the game directory
# are never modified.
#
# Requires [tes4edit] to be configured in tools.toml.
# Run: mudcrab setup-tools MOFAM-test/input/mofam.full.toml
#      to generate a tools.toml template for this modlist.

[[mods]]
id = "Cleaned DLC Masters"
oracle_name = "Clean ESM"  # ours is build-from-files
section = ["CLEANED MASTERS"]
type = "build-from-files"
files = [
	"%GAME_DIR%/OriginalESPs/DLC*.esp",
	"%GAME_DIR%/OriginalESPs/Knights.esp",
]

# Commenting this out for now to save time on re-builds
# TODO: uncomment this at the end!
# [[mods.actions]]
# action = "qac"
# # Glob patterns are resolved relative to this mod's staged data folder.
# plugins = ["DLC*.esp", "Knights.esp"]

