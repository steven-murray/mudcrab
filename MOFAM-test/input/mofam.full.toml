file_name = "2x Weapons-49351-2-1-1559863627.7z"

[[mods.archives]]   # guide 3
path = "nexus:oblivion/49351/1000022284"
download_handler = "nexus"
file_name = "2x Armor-49351-2-1-1559860730.7z"

[[mods.archives]]   # guide 4
path = "nexus:oblivion/49645/1000023018"
download_handler = "nexus"
file_name = "kart_SIUT_clothes_2x-49645-1-1569650528.7z"

[[mods.archives]]   # guide 5
path = "nexus:oblivion/49645/1000023004"
download_handler = "nexus"
file_name = "2x Weapons-49645-1-1569455463.7z"

# Pack before the dummy plugin exists, or the plugin ends up inside the archive
# it is meant to load.
[[mods.actions]]
action = "pack_bsa"
output = "OUT Essentials.bsa"
prune_packed = true

[[mods.actions]]
action = "create_dummy_plugin"
output = "OUT Essentials.esp"

