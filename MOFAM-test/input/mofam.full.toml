# Guide: BAIN -> "00 Textures" and "04 Statues and Shrines", then pack with
# BSArch, name the BSA and a dummy plugin after the mod, and delete the loose
# meshes/textures. The archive spells the subpackage "04 Statues and shrines";
# the Oracle's own meta.ini records that same lowercase form under
# [Plugins] BAIN%20Installer, so the guide's capitalisation is the typo.
#
# The BSA exists to keep ~2000 LOD files out of the VFS, so packing is the
# point of the row, not an optimisation -- hence the file_prune afterwards.
[[mods]]
id = "Evenstars Colourwheel LOD Update"
