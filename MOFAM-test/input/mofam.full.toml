action = "extract_bsa"
archive = "Oscuro's_Oblivion_Overhaul.bsa"

# ...and repack the lot under the same name, dropping the loose copies the
# archive now holds. `prune_packed` deletes exactly what went in, which a
# hand-written glob cannot: this row first guessed "menus" (not in the archive)
# and "sound" (the staged tree has "Sound").
[[mods.actions]]
