# post-install-actions = ["loot-sort"]
#
# Disabled deliberately. LOOT opens a GUI that needs a human to approve its
# masterlist prompt, so an unattended run sits at it until the 180s timeout --
# which is a broken build, not a sorted load order. Part 9's 22-minute stall was
# this.
#
# Nothing depends on it while the list is being built: `plugins.txt` is written
# from the plan's own `plugins` array by the MO2 export, so the load order is
# whatever this file says it is. Part 37 replaces it with a fixed
# `loadorder.txt` anyway, which is the real answer.
#
# Turn it back on for a play-test, with someone at the keyboard.

[ini]
"iSize W" = 2560
"iSize H" = 1600
"bSaveOnInteriorExteriorSwitch" = 0
"bSaveOnRest" = 0
"bSaveOnTravel" = 0
"bSaveOnWait" = 0
"bAllowScriptedAutosave" = 0

[inputs]

# ------------------------------
# Part 1 - CLEANED MASTERS
# ------------------------------

# Copies Oblivion's DLC .esp files from the game Data folder into a managed
# MO2 mod, then runs xEdit Quick Auto Clean on each one. The cleaned copies
# shadow the originals via MO2's VFS; the originals in the game directory
# are never modified.
#
# Requires [tes4edit] to be configured in tools.toml.
# Run: mudcrab setup-tools MOFAM-test/input/mofam.full.toml
#      to generate a tools.toml template for this modlist.

[[mods]]
id = "Cleaned DLC Masters"
oracle_name = "Clean ESM"  # ours is build-from-files
section = ["CLEANED MASTERS"]
type = "build-from-files"
files = [
	"%GAME_DIR%/OriginalESPs/DLC*.esp",
	"%GAME_DIR%/OriginalESPs/Knights.esp",
]

# Commenting this out for now to save time on re-builds
# TODO: uncomment this at the end!
# [[mods.actions]]
# action = "qac"
# # Glob patterns are resolved relative to this mod's staged data folder.
# plugins = ["DLC*.esp", "Knights.esp"]

