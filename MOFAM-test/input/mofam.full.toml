# Oracle's BSA contains too (3580 textures, no meshes).
#
# `prune_packed` removes the loose copies afterwards. The Oracle kept them, so
# its BSA is shadowed by the very files it holds: MO2 gives loose files
# precedence over archives regardless of priority, so nothing in that archive is
# ever read. Ours is the reading the instruction only makes sense under.
[[mods.actions]]
action = "pack_bsa"
output = "OOO Enhanced.bsa"
include = ["textures/**"]
