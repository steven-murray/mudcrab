# Guide 1-6: "Create the empty mod 'OUT Essentials' and download & install mods
# 1-5 whilst copying their contents to this empty mod... Once all of mods 1-5
# have been copied here, pack the mod through BSArch."
#
# That is one mod assembled from five archives, which is the same archetype as
# Part 9's OOO + voice files. Writing it that way makes the copying step vanish:
# the five archives layer into one staged folder, `pack_bsa` writes the archive,
# `prune_packed` removes exactly what went in, and `create_dummy_plugin` gives
# Oblivion the plugin it needs to load a BSA at all.
#
# The guide's rows 1-5 therefore have no mod of their own here. They exist in
# the Oracle as five folders holding nothing but a meta.ini -- the guide's own
# optional step, "I also delete mods 1-5 after this step to save on instance
# space" -- so `diff` reports them as missing from ours. They are: an empty MO2
# folder is bookkeeping, not a build artifact, and every file they once held is
# in OUT Essentials.bsa.
[[mods]]
id = "OUT Essentials"
section = ["11 - BASELINE TEXTURES"]

[[mods.archives]]   # guide 1
path = "nexus:oblivion/49351/1000022285"
download_handler = "nexus"
file_name = "2x Clothes-49351-2-1-1559861273.7z"

[[mods.archives]]   # guide 2 -- the page offers two identical downloads; this is 'yeeeet'
