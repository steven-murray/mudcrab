# not, so they are excluded here rather than packed into the BSA.
#
# Both spellings are listed because archive-side globs are case-*sensitive*
# while staged-tree ones are not. That asymmetry is a known deferred item and
# this is another instance of it: one pattern looks like it covers the case and
# silently catches 4 of 14. See notes/ooo-enhanced-thumbs-db.txt.
