name: GUI

# The GUI (gui/): its front end type-checked and built, its commands tested
# end to end on Tauri's mock runtime, and a binary built, on Linux and
# Windows. Separate from CI because it needs WebKitGTK and Node, which the
# CLI does not.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["gui/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/gui.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            bundles: appimage
          - os: windows-latest
            name: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Front end
        working-directory: gui
        run: |
          npm ci
          npm run check
          npm run build
      - run: cargo clippy -p mudcrab-gui --all-targets -- -D warnings
      - run: cargo test -p mudcrab-gui
      # The bundles a release ships -- an AppImage, a Windows installer -- so
      # a change that breaks packaging shows here, and a pull request's build
      # can be tried as a player would get it.
      - name: Bundle
        working-directory: gui
        shell: bash
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: mudcrab-gui-${{ matrix.name }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/mudcrab-gui.exe
          if-no-files-found: error
