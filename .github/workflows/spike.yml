name: GUI spike

# Builds the phase-3 framework spike (spikes/) for Linux and Windows, so each
# can be tried on machines other than the one it was written on: Windows, and
# the Steam Deck (the Linux build). Not part of a release.
on:
  push:
    paths: ["spikes/**", ".github/workflows/spike.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes
      - name: WebKitGTK and friends (Tauri on Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfontconfig1-dev
      - run: cargo test -p spike-core
      - run: cargo build --release -p spike-tauri -p spike-slint
      - uses: actions/upload-artifact@v4
        with:
          name: mudcrab-gui-spike-${{ matrix.name }}
          path: |
            spikes/target/release/spike-tauri
            spikes/target/release/spike-slint
            spikes/target/release/spike-tauri.exe
            spikes/target/release/spike-slint.exe
            spikes/sample/
          if-no-files-found: error
