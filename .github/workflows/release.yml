name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      # The audience is modders, not Rust developers: ship something they can
      # download and run. The licences travel with it -- a binary handed over
      # without them grants nobody anything.
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/mudcrab dist/
          cp LICENSE-MIT LICENSE-APACHE readme.md dist/
          tar -C dist -czf mudcrab-${{ matrix.target }}.tar.gz .
      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\mudcrab.exe dist\
          copy LICENSE-MIT dist\
          copy LICENSE-APACHE dist\
          copy readme.md dist\
          Compress-Archive -Path dist\* -DestinationPath mudcrab-${{ matrix.target }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: mudcrab-${{ matrix.target }}.*
